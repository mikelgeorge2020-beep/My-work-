<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛪ كنيسة الأنبا صموئيل المعترف بأبيس الثورة - اجتماع أسرة القديسة فيرينا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5b21b6;--primary-light:#7c3aed;--accent:#f59e0b;--success:#059669;--success-light:#10b981;--danger:#dc2626;--text:#1c1838;--text-2:#6b6880;--text-3:#9d99b5;--border:#ece7f7;--border-2:#e2dcf0;--shadow-sm:0 2px 8px rgba(91,33,182,.06);--shadow-md:0 8px 24px rgba(91,33,182,.10);--radius:16px;--radius-lg:22px;--radius-pill:999px}
html,body{height:100%}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f5f2fb 0%,#fdf6ec 100%);background-attachment:fixed;color:var(--text);line-height:1.7;min-height:100vh}
.hidden{display:none!important}
h2,h3,h4,h5{font-weight:800}
input,select,textarea,button{font-family:inherit;font-size:15px;color:inherit}
input,select,textarea{padding:12px 14px;border:1.5px solid var(--border-2);border-radius:12px;width:100%;background:#fbfaff;transition:.2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
label{display:block;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--text-2)}
label input,label select,label textarea{margin-top:6px;font-weight:500}
.btn{padding:11px 20px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:#e9e4f5;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 6px 16px rgba(91,33,182,.28)}
.btn.green{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn.amber{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn.red{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--border-2);color:var(--text-2)}
.btn.small{padding:7px 14px;font-size:13px;border-radius:10px}
.btn.block{width:100%;margin-top:10px;padding:13px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2e1065,#5b21b6 40%,#7c3aed)}
.auth-wrap::before,.auth-wrap::after{content:'';position:absolute;border-radius:50%;filter:blur(80px);opacity:.45}
.auth-wrap::before{width:500px;height:500px;background:#fbbf24;top:-150px;left:-150px}
.auth-wrap::after{width:600px;height:600px;background:#ec4899;bottom:-200px;right:-200px}
.auth-card{position:relative;z-index:2;background:rgba(255,255,255,.98);padding:32px 28px;border-radius:26px;width:100%;max-width:520px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto}
.auth-card .brand{text-align:center;font-size:22px;font-weight:900;color:var(--primary);margin-bottom:4px}
.auth-card .sub-brand{text-align:center;font-size:14px;color:var(--accent);font-weight:700;margin-bottom:8px}
.auth-card .brand-divider{display:block;width:60px;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;margin:12px auto 20px}
.auth-card h2{font-size:17px;margin-bottom:16px;color:var(--text-2);text-align:center}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.role-tab-btn{padding:12px 8px;border-radius:14px;border:1.5px solid var(--border-2);background:#fbfaff;cursor:pointer;font-weight:700;font-size:13px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s}
.role-tab-btn .ico{font-size:22px}
.role-tab-btn.active{background:linear-gradient(135deg,#ede9fe,#fef3c7);border-color:var(--primary);color:var(--primary);box-shadow:0 4px 12px rgba(91,33,182,.15)}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-3);padding:4px}
.form-section-title{margin:18px 0 10px;color:var(--primary);font-size:13.5px;font-weight:800;padding-bottom:6px;border-bottom:1.5px solid var(--border)}
.hint{font-size:13px;color:var(--text-3);margin:14px 0;text-align:center}
.err{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:14px;border-right:4px solid var(--danger)}
.photo-upload{display:flex;align-items:center;gap:14px;padding:14px;background:#fbfaff;border:2px dashed var(--border-2);border-radius:14px;cursor:pointer;transition:.2s;margin-top:6px}
.photo-upload:hover{border-color:var(--primary-light);background:#f5f2fb}
.photo-preview{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ede9fe,#fef3c7);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--primary);overflow:hidden;flex-shrink:0;border:2px solid #fff}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.date-selects{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:6px}
.avatar-sm{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 6px rgba(91,33,182,.15);vertical-align:middle}
.avatar-placeholder{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;vertical-align:middle;border:2px solid #fff}
.name-cell{display:flex;align-items:center;gap:10px}
.topbar{background:linear-gradient(135deg,#2e1065,#5b21b6 50%,#7c3aed);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
.topbar .brand{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.15);padding:7px 14px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.2)}
.bell{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;left:-4px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 22px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--border);position:sticky;top:68px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 18px;border-radius:var(--radius-pill);border:1.5px solid transparent;background:#f3eeff;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--text-2);transition:.2s}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 6px 16px rgba(91,33,182,.3)}
.view{padding:22px;max-width:1150px;margin:0 auto}
.card{background:#fff;border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:.2s}
.card:hover{box-shadow:var(--shadow-md)}
.card h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-title{font-size:17px;margin:22px 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
.empty{color:var(--text-3);text-align:center;padding:32px 20px;font-size:14px;background:#fafaff;border-radius:14px;border:1.5px dashed var(--border-2);font-weight:600}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.search{max-width:260px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{border-radius:var(--radius);padding:22px 18px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md);transition:.25s}
.stat:hover{transform:translateY(-4px)}
.stat:nth-child(1){background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.stat:nth-child(2){background:linear-gradient(135deg,#0891b2,#22d3ee)}
.stat:nth-child(3){background:linear-gradient(135deg,#d97706,#fbbf24)}
.stat:nth-child(4){background:linear-gradient(135deg,#059669,#10b981)}
.stat-num{font-size:34px;font-weight:900;position:relative;z-index:1}
.stat-lbl{font-size:13px;font-weight:600;opacity:.92;position:relative;z-index:1;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 12px;text-align:right;border-bottom:1px solid var(--border)}
th{background:#faf8ff;color:var(--text-2);font-size:12.5px;font-weight:800;white-space:nowrap}
tr:hover td{background:#fdfcff}
.table-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border-radius:14px;border:1px solid var(--border);background:#fff}
.att-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.att-opts{display:flex;gap:6px;flex-wrap:wrap}
.att-opts label{display:flex;align-items:center;gap:4px;margin:0;padding:7px 12px;border:1.5px solid var(--border-2);border-radius:var(--radius-pill);cursor:pointer;font-size:12.5px;background:#fff;font-weight:700;color:var(--text-2)}
.att-opts input{display:none}
.att-opts label.on.present{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-color:transparent}
.att-opts label.on.late{background:linear-gradient(135deg,#d97706,#fbbf24);color:#fff;border-color:transparent}
.att-opts label.on.excused{background:linear-gradient(135deg,#0891b2,#22d3ee);color:#fff;border-color:transparent}
.att-opts label.on.absent{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent}
.points-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-pill);font-weight:800;font-size:12px;color:#fff}
.points-badge.green{background:linear-gradient(135deg,#059669,#10b981)}
.points-badge.blue{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.points-badge.red{background:linear-gradient(135deg,#dc2626,#ef4444)}
.point-action{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.point-action button{padding:16px 12px;border-radius:16px;border:none;cursor:pointer;font-weight:800;font-size:15px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.point-action button.green-btn{background:linear-gradient(135deg,#059669,#10b981)}
.point-action button.blue-btn{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.point-action button.red-btn{background:linear-gradient(135deg,#dc2626,#ef4444)}
.tree-box{text-align:center;background:linear-gradient(180deg,#f5f2fb,#fdf6ec);border-radius:20px;padding:16px;border:1.5px solid var(--border)}
.big-points{font-size:52px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;margin-top:8px}
.notif{border-radius:16px;background:#fff;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);border-right:5px solid var(--primary-light)}
.tag{background:linear-gradient(135deg,#ede9fe,#ddd6fe);color:var(--primary);padding:3px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:800;display:inline-block}
.role-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:999px;font-size:11.5px;font-weight:800}
.role-chip.member{background:#dbeafe;color:#1e40af}
.role-chip.servant{background:#fef3c7;color:#92400e}
.role-chip.leader{background:#d1fae5;color:#065f46}
.role-chip.admin{background:#fee2e2;color:#991b1b}
.download-source-btn{position:fixed;bottom:20px;right:20px;z-index:999;background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(5,150,105,.4);display:flex;align-items:center;gap:8px;border:none;cursor:pointer;transition:.2s}
.sync-badge{position:fixed;bottom:14px;left:14px;background:#fff;padding:8px 14px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;box-shadow:var(--shadow-md);z-index:60;border:1.5px solid var(--border)}
.sync-badge.online{color:#059669;border-color:#a7f3d0;background:#f0fdf4}
.sync-badge.pending{color:#d97706;border-color:#fde68a;background:#fffbeb}
.sync-badge.error{color:#dc2626;border-color:#fecaca;background:#fef2f2}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.cal-day{border-radius:12px;padding:10px;min-height:75px;border:1.5px solid var(--border);background:#fafaff;display:flex;flex-direction:column;justify-content:space-between}
.cal-day.thursday{border-color:var(--primary);background:#f6f1fd}
.cal-day-num{font-weight:800;font-size:14px}
.cal-badge{font-size:11px;font-weight:700;background:var(--primary);color:#fff;padding:2px 6px;border-radius:6px;margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1c1838,#3a3466);color:#fff;padding:14px 22px;border-radius:14px;z-index:9999;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(28,24,56,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:22px;padding:26px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div id="syncBadge" class="sync-badge" style="display:none"></div>
<button class="download-source-btn" onclick="downloadCurrentHTML()">📥 تنزيل كود المنصة (index.html)</button>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">⛪ كنيسة الأنبا صموئيل المعترف بأبيس الثورة</div>
    <div class="sub-brand">اجتماع أسرة القديسة فيرينا</div>
    <div class="brand-divider"></div>

    <div id="loginBox">
      <h2>تسجيل الدخول</h2>
      <div id="loginErr" class="err" style="display:none"></div>
      <form id="loginForm" autocomplete="off">
        <label>اسم المستخدم<input name="username" required placeholder="اكتب اسم المستخدم أو رقم الهاتف" autocomplete="off"></label>
        <label>كلمة المرور
          <div class="pw-wrap">
            <input type="password" id="loginPw" name="password" required placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('loginPw', this)">👁️</button>
          </div>
        </label>
        <button class="btn primary block" type="submit">دخول</button>
      </form>
      <button class="btn ghost block" onclick="showRegister()">تسجيل مخدوم جديد</button>
    </div>

    <div id="registerBox" style="display:none">
      <h2>📝 تسجيل مخدوم جديد</h2>
      <form id="registerForm" autocomplete="off">
        <div class="form-section-title">🔐 بيانات الدخول</div>
        <label>الاسم بالكامل *<input name="name" required placeholder="الاسم الثلاثي أو الرباعي"></label>
        <label>اسم المستخدم *<input name="username" required placeholder="اسم فريد بدون مسافات"></label>
        <label>كلمة المرور *
          <div class="pw-wrap">
            <input type="password" id="regPw" name="password" required placeholder="••••••••">
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('regPw', this)">👁️</button>
          </div>
        </label>
        <div class="form-section-title">👤 بيانات شخصية والافتقاد</div>
        <label>رقم الهاتف *<input name="phone" required placeholder="01xxxxxxxxx"></label>
        <label>أب الاعتراف<input name="confessionFather" placeholder="اسم أب الاعتراف"></label>
        <label>العنوان<input name="address" placeholder="المنطقة / الشارع"></label>
        <label>المرحلة / الوظيفة<input name="education" placeholder="طالب، خريج، مهنة..."></label>
        <button class="btn green block" type="submit">✅ إنشاء الحساب وإرساله للإدارة</button>
      </form>
      <button class="btn ghost block" onclick="showLogin()">رجوع لتسجيل الدخول</button>
    </div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">⛪ أسرة القديسة فيرينا - كنيسة الأنبا صموئيل بأبيس الثورة</div>
    <div class="top-actions">
      <button class="btn small" style="background:#10b981;color:#fff" onclick="sendQuickBroadcast()">📢 إرسال إشعار فوري</button>
      <button class="btn small ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="refreshDataOnline()">🔄 تحديث الحسابات</button>
      <button class="bell" onclick="go('notifications')">🔔<span id="bellBadge" class="badge" style="display:none">0</span></button>
      <span id="userChip" class="chip"></span>
      <button class="btn small ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="logout()">خروج</button>
    </div>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="view" class="view"></main>
</div>

<div id="modalRoot"></div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDopFwnPp3oS2UnMXt9YEHGOLFQmpR4-Dk",
  authDomain: "stmariam-1fdc0.firebaseapp.com",
  databaseURL: "https://stmariam-1fdc0-default-rtdb.firebaseio.com",
  projectId: "stmariam-1fdc0",
  storageBucket: "stmariam-1fdc0.firebasestorage.app",
  messagingSenderId: "105645960370",
  appId: "1:105645960370:web:cb11fb7fc5bbea9cbdedab"
};

var fdb = null, firebaseOk = false, pendingWrites = 0;
var cache = {}, fromFirebase = false;
var KEYS = ['users','members','attendance','points','media','notifs','settings','calendar'];

function initFirebase(){
  try { firebase.initializeApp(firebaseConfig); fdb = firebase.database(); firebaseOk = true; return true; }
  catch(e){ console.error('Firebase error:', e); firebaseOk = false; return false; }
}
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).substring(2, 7); }
function K(p){ return 'chm_' + p; }
function esc(s){ if(s === null || s === undefined) s = ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}); }
function fmtTime(ts){ return new Date(ts).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ var d = new Date(); return d.toISOString().slice(0,10); }
function initial(name){ return name && name.length ? name.charAt(0) : '?'; }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3000); }
function get(k, def){ return (cache[k] === undefined || cache[k] === null) ? def : cache[k]; }
function set(k, v){
  cache[k] = v;
  try { localStorage.setItem(K(k), JSON.stringify(v)); } catch(e){}
  if(firebaseOk && fdb && !fromFirebase){
    pendingWrites++; updateSyncBadge();
    fdb.ref('chm/' + k).set(v).then(function(){ pendingWrites--; updateSyncBadge(); }).catch(function(){ pendingWrites--; updateSyncBadge(); });
  }
}
function updateSyncBadge(){
  var b = document.getElementById('syncBadge');
  if(!b) return;
  b.style.display = 'block';
  if(!firebaseOk){ b.className='sync-badge error'; b.textContent='❌ Firebase غير متصل'; }
  else if(pendingWrites > 0){ b.className='sync-badge pending'; b.textContent='⏳ جاري المزامنة...'; }
  else { b.className='sync-badge online'; b.textContent='✅ متزامن لحظياً (أبيس الثورة)'; }
}
function setupFirebaseListeners(){
  if(!firebaseOk || !fdb) return;
  fdb.ref('chm').on('value', function(snap){
    var val = snap.val() || {};
    var changed = JSON.stringify(cache) !== JSON.stringify(val);
    fromFirebase = true;
    cache = val;
    try { KEYS.forEach(function(k){ if(cache[k] !== undefined && cache[k] !== null){ localStorage.setItem(K(k), JSON.stringify(cache[k])); } }); } catch(e){}
    setTimeout(function(){ fromFirebase = false; }, 50);
    if(changed && state.user){
      var users = get('users', []);
      for(var i=0;i<users.length;i++){ if(users[i].id === state.user.id){ state.user = users[i]; break; } }
      $('#userChip').textContent = state.user.name + ' — ' + roleLabel(state.user.role);
      renderTabs(); render();
    }
    updateSyncBadge();
  });
}

function refreshDataOnline(){
  if(firebaseOk && fdb){
    toast('🔄 جاري فحص ومزامنة الحسابات...');
    fdb.ref('chm').once('value').then(function(snap){
      var val = snap.val() || {};
      cache = val;
      toast('✅ تم تحديث كافة البيانات والحسابات فوراً');
      render();
    });
  } else {
    toast('⚠️ تم التحديث من الذاكرة المحلية');
    render();
  }
}

function togglePasswordVisibility(fieldId, btn){
  var field = document.getElementById(fieldId);
  if(!field) return;
  if(field.type === 'password'){ field.type = 'text'; btn.textContent = '🙈'; }
  else { field.type = 'password'; btn.textContent = '👁️'; }
}

var state = { user: null, tab: 'home', pointMember: null };

function init(){
  KEYS.forEach(function(k){ try { var v = localStorage.getItem(K(k)); if(v !== null) cache[k] = JSON.parse(v); } catch(e){} });
  var ok = initFirebase();
  if(ok && fdb){
    fdb.ref('chm').once('value').then(function(snap){
      var val = snap.val() || {};
      if(!val.users || !val.users.length){
        val.users = [
          { id: uid(), name:'نيفين فؤاد (أمينة الخدمة)', username:'amena', password:'2805022', role:'leader', active:true, created:Date.now(), notifSeen:0 },
          { id: uid(), name:'المشرف العام (Admin)', username:'admin', password:'admin123', role:'admin', active:true, created:Date.now(), notifSeen:0 }
        ];
        val.members = []; val.attendance = []; val.points = []; val.media = []; val.notifs = [];
        val.settings = { pPresent:10, pLate:5, pExcused:1, pAbsent:0 };
        val.calendar = [
          { date: '2025-04-10', title: 'القديسة فيرينا وإشعاع الطهارة والخدمة', speaker: 'إلقاء القس راعي الاجتماع بكنيسة الأنبا صموئيل بأبيس', status: 'جاهز ومؤكد' }
        ];
        fdb.ref('chm').set(val);
      }
      cache = val;
      finishInit();
      setupFirebaseListeners();
    }).catch(function(){ finishInit(); });
  } else { finishInit(); }
}

function finishInit(){
  var sid = get('session', null);
  if(sid){
    var users = get('users', []);
    for(var i=0;i<users.length;i++){
      if(users[i].id === sid){ state.user = users[i]; showApp(); updateSyncBadge(); return; }
    }
  }
  showLogin();
  updateSyncBadge();
}

function showLogin(){
  $('#authScreen').classList.remove('hidden');
  $('#appScreen').classList.add('hidden');
  $('#loginBox').style.display = 'block';
  $('#registerBox').style.display = 'none';
}
function showRegister(){
  $('#loginBox').style.display = 'none';
  $('#registerBox').style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  var uname = f.username.value.trim().toLowerCase();
  var pwd = f.password.value;
  var users = get('users', []);
  var u = null;
  for(var i=0;i<users.length;i++){
    if((users[i].username.toLowerCase() === uname || (users[i].phone && users[i].phone === uname)) && users[i].password === pwd){
      u = users[i]; break;
    }
  }
  var err = $('#loginErr');
  if(!u){ err.textContent='اسم المستخدم أو كلمة المرور غير صحيحة'; err.style.display='block'; return; }
  if(u.active === false){ err.textContent='الحساب في انتظار موافقة الإدارة'; err.style.display='block'; return; }
  err.style.display = 'none';
  state.user = u;
  set('session', u.id);
  f.reset();
  showApp();
});

document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  var name = f.name.value.trim(), username = f.username.value.trim().toLowerCase(), pwd = f.password.value;
  var phone = f.phone.value.trim(), confessionFather = f.confessionFather.value.trim(), addr = f.address.value.trim(), edu = f.education.value.trim();
  var users = get('users', []);
  for(var i=0;i<users.length;i++){ if(users[i].username.toLowerCase() === username){ alert('اسم المستخدم مسجل بالفعل'); return; } }

  var newUser = { id: uid(), name:name, username:username, password:pwd, phone:phone, role:'member', active:true, created:Date.now(), notifSeen:0 };
  users.push(newUser);
  set('users', users);

  var members = get('members', []);
  members.push({ id: uid(), userId: newUser.id, name:name, phone:phone, confessionFather:confessionFather, address:addr, education:edu, created:Date.now() });
  set('members', members);

  var notifs = get('notifs', []);
  notifs.push({ id: uid(), title: 'تسجيل مخدوم جديد — '+name, body: '👤 مخدوم جديد:\n'+name+'\n📱 هاتف: '+phone+'\n⛪ أب الاعتراف: '+(confessionFather||'—'), audience: 'servants', author: name, date: Date.now() });
  set('notifs', notifs);

  alert('✅ تم تسجيل الحساب بنجاح وهو متاح فوراً للإدارة والمتابعة!');
  f.reset();
  showLogin();
});

function logout(){ set('session', null); state.user = null; showLogin(); }

var TABS = [
  {id:'home',label:'🏠 الرئيسية',show:function(){return true;}},
  {id:'calendar',label:'📅 التقويم وأجندة الخميس',show:function(){return true;}},
  {id:'members',label:'👥 المخدومون والافتقاد',show:function(){return true;}},
  {id:'attendance',label:'✅ الحضور',show:function(){return true;}},
  {id:'points',label:'⭐ شجرة النمو والنقاط',show:function(){return true;}},
  {id:'notifications',label:'🔔 الإشعارات',show:function(){return true;}},
  {id:'admin',label:'⚙️ الإدارة',show:function(u){return u && (u.role==='admin'||u.role==='leader');}}
];

function showApp(){
  $('#authScreen').classList.add('hidden');
  $('#appScreen').classList.remove('hidden');
  $('#userChip').textContent = state.user.name + ' — ' + roleLabel(state.user.role);
  renderTabs(); render();
}
function roleLabel(r){ if(r==='admin') return 'مشرف عام'; if(r==='leader') return 'أمينة الخدمة'; if(r==='servant') return 'خادم'; return 'مخدوم'; }
function roleChip(r){
  if(r==='admin') return '<span class="role-chip admin">👑 مشرف عام</span>';
  if(r==='leader') return '<span class="role-chip leader">💼 أمينة الخدمة</span>';
  if(r==='servant') return '<span class="role-chip servant">🙋 خادم</span>';
  return '<span class="role-chip member">👤 مخدوم</span>';
}
function renderTabs(){
  var nav = $('#tabs'), html = '';
  for(var i=0;i<TABS.length;i++){ var t = TABS[i]; if(!t.show(state.user)) continue; var cls = state.tab === t.id ? 'active' : ''; html += '<button class="'+cls+'" onclick="go(\''+t.id+'\')">'+t.label+'</button>'; }
  nav.innerHTML = html;
}
function go(tab){ state.tab = tab; renderTabs(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){
  var v = $('#view');
  var map = {home:viewHome,calendar:viewCalendar,members:viewMembers,attendance:viewAttendance,points:viewPoints,notifications:viewNotifications,admin:viewAdmin};
  (map[state.tab] || viewHome)(v);
  updateBell();
}

function viewHome(v){
  var members = get('members', []), att = get('attendance', []), notifs = get('notifs', []);
  var today = todayStr(), todayPresent = 0;
  for(var i=0;i<att.length;i++){ if(att[i].date===today && att[i].status==='present') todayPresent++; }
  v.innerHTML = '<div class="card" style="border-right:5px solid var(--primary);background:linear-gradient(135deg,#ffffff,#fdfbfe)">'+
      '<h3>⛪ كنيسة الأنبا صموئيل المعترف بأبيس الثورة</h3>'+
      '<p style="color:var(--text-2);font-size:15px">مرحباً بك في منصة متابعة <b>اجتماع الخميس أسرة القديسة فيرينا</b>. يمكنك رصد الحضور، تسجيل اللقاءات، وتوزيع النقاط التحفيزية بدقة.</p>'+
    '</div>'+
    '<div class="grid-stats">'+
      '<div class="stat"><div class="stat-num">'+members.length+'</div><div class="stat-lbl">إجمالي المخدومين</div></div>'+
      '<div class="stat"><div class="stat-num">'+todayPresent+'</div><div class="stat-lbl">حضور اليوم</div></div>'+
      '<div class="stat"><div class="stat-num">4</div><div class="stat-lbl">لقاءات الشهر</div></div>'+
      '<div class="stat"><div class="stat-num">'+notifs.length+'</div><div class="stat-lbl">إشعار</div></div>'+
    '</div>'+
    '<h3 class="sec-title">🔔 أحدث التنبيهات واللقاءات</h3>'+
    (notifs.length ? notifs.slice(0,3).map(function(n){ return '<div class="notif"><h4>🔔 '+esc(n.title)+'</h4><p>'+esc(n.body)+'</p><small>'+fmtTime(n.date)+' • ✍️ '+esc(n.author)+'</small></div>'; }).join('') : '<p class="empty">لا توجد إشعارات مسجلة</p>');
}

function viewCalendar(v){
  var cal = get('calendar', []);
  var listHTML = cal.map(function(c, idx){
    return '<div class="card" style="border-right:5px solid var(--primary)">'+
      '<div class="card-head"><h3 style="margin:0">📖 لقاء: '+esc(c.title)+'</h3><span class="tag">'+esc(c.date)+'</span></div>'+
      '<p><b>👤 الخادم المتكلم:</b> '+esc(c.speaker)+'</p>'+
      '<p style="margin-top:6px;color:var(--text-2)"><b>الحالة:</b> '+esc(c.status||'مؤكد')+'</p>'+
      '<button class="btn small red" style="margin-top:10px" onclick="delCalItem('+idx+')">🗑️ حذف</button>'+
    '</div>';
  }).join('');

  v.innerHTML = '<div class="card">'+
      '<div class="card-head"><h3 style="margin:0">📅 تسجيل موضوع وخادم لقاء الخميس</h3></div>'+
      '<form id="calForm" class="form-row">'+
        '<div><label>تاريخ الخميس</label><input type="date" name="date" required value="'+todayStr()+'"></div>'+
        '<div><label>موضوع الكلمة الروحية</label><input name="title" required placeholder="عنوان الموضوع"></div>'+
        '<div><label>الخادم / المتكلم</label><input name="speaker" required placeholder="اسم الخادم أو الكاهن"></div>'+
        '<button class="btn primary" type="submit">💾 حفظ اللقاء</button>'+
      '</form>'+
    '</div>'+
    '<h3 class="sec-title">🗓️ جدول لقاءات أسرة القديسة فيرينا</h3>'+
    (listHTML || '<p class="empty">لم يتم إضافة موضوعات بعد</p>');

  document.getElementById('calForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;
    var arr = get('calendar', []);
    arr.push({ date: f.date.value, title: f.title.value.trim(), speaker: f.speaker.value.trim(), status: 'مؤكد' });
    set('calendar', arr);
    toast('✅ تم حفظ تفاصيل لقاء الخميس');
    viewCalendar(v);
  });
}
function delCalItem(idx){
  var arr = get('calendar', []);
  arr.splice(idx, 1);
  set('calendar', arr);
  toast('🗑️ تم الحذف');
  viewCalendar($('#view'));
}

function viewMembers(v){
  var members = get('members', []);
  var rows = members.map(function(m, idx){
    return '<tr><td>'+(idx+1)+'</td><td><b>'+esc(m.name)+'</b></td><td>'+esc(m.phone||'—')+'</td><td>'+esc(m.confessionFather||'—')+'</td><td>'+esc(m.education||'—')+'</td><td><button class="btn small red" onclick="delMemberItem(\''+m.id+'\')">🗑️</button></td></tr>';
  }).join('');

  v.innerHTML = '<div class="card">'+
      '<div class="card-head"><h3 style="margin:0">👥 سجل المخدومين والافتقاد ('+members.length+')</h3></div>'+
      (rows ? '<div class="table-wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>أب الاعتراف</th><th>المرحلة</th><th>إجراء</th></tr></thead><tbody>'+rows+'</tbody></table></div>' : '<p class="empty">لا يوجد مخدومون مسجلون بعد</p>')+
    '</div>';
}
function delMemberItem(id){
  if(!confirm('حذف هذا المخدوم؟')) return;
  set('members', get('members', []).filter(function(m){ return m.id !== id; }));
  toast('🗑️ تم الحذف');
  viewMembers($('#view'));
}

function viewAttendance(v){
  var members = get('members', []);
  var rows = members.map(function(m){
    return '<div class="att-row" data-id="'+m.id+'">'+
      '<div class="name-cell"><b>'+esc(m.name)+'</b></div>'+
      '<div class="att-opts">'+
        '<label class="present on"><input type="radio" name="att_'+m.id+'" value="present" checked>✅ حاضر (+10)</label>'+
        '<label class="late"><input type="radio" name="att_'+m.id+'" value="late">⏰ تأخير (+5)</label>'+
        '<label class="excused"><input type="radio" name="att_'+m.id+'" value="excused">🕐 إذن (+1)</label>'+
        '<label class="absent"><input type="radio" name="att_'+m.id+'" value="absent">❌ غائب (0)</label>'+
      '</div>'+
    '</div>';
  }).join('');

  v.innerHTML = '<div class="card">'+
      '<h3>✅ تسجيل حضور لقاء الخميس</h3>'+
      '<div class="form-row" style="margin-bottom:14px">'+
        '<div><label>التاريخ</label><input type="date" id="attDate" value="'+todayStr()+'"></div>'+
        '<div><label>اسم الاجتماع</label><input id="attSession" value="اجتماع الخميس - أسرة القديسة فيرينا"></div>'+
      '</div>'+
      (rows ? rows + '<button class="btn green block" style="margin-top:16px" onclick="saveAttendanceRecord()">💾 اعتماد وحفظ سجل الحضور</button>' : '<p class="empty">أضف مخدومين أولاً لرصد الحضور</p>')+
    '</div>';

  var labels = document.querySelectorAll('.att-opts label');
  for(var i=0;i<labels.length;i++){
    labels[i].addEventListener('click', function(){
      var siblings = this.parentElement.querySelectorAll('label');
      for(var j=0;j<siblings.length;j++) siblings[j].classList.remove('on');
      this.classList.add('on');
    });
  }
}
function saveAttendanceRecord(){
  var date = $('#attDate').value, session = $('#attSession').value;
  var members = get('members', []);
  var att = get('attendance', []);
  var points = get('points', []);
  for(var i=0;i<members.length;i++){
    var m = members[i];
    var val = document.querySelector('input[name="att_'+m.id+'"]:checked').value;
    var pts = val === 'present' ? 10 : val === 'late' ? 5 : val === 'excused' ? 1 : 0;
    att.push({ id: uid(), memberId: m.id, date: date, session: session, status: val });
    if(pts > 0){ points.push({ id: uid(), memberId: m.id, points: pts, reason: 'حضور '+session+' ('+date+')', date: Date.now() }); }
  }
  set('attendance', att);
  set('points', points);
  toast('✅ تم اعتماد وحفظ الحضور وتوزيع النقاط بنجاح!');
  go('points');
}

function viewPoints(v){
  var members = get('members', []);
  var pointsLog = get('points', []);
  var items = members.map(function(m){
    var total = 0;
    for(var i=0;i<pointsLog.length;i++){ if(pointsLog[i].memberId === m.id) total += pointsLog[i].points; }
    return '<div class="card" style="text-align:center">'+
      '<h3>🌳 '+esc(m.name)+'</h3>'+
      '<div class="big-points">'+total+'</div>'+
      '<p style="color:var(--text-2);font-weight:700">نقطة روحية</p>'+
      '<div class="point-action">'+
        '<button class="green-btn" onclick="addManualPoints(\''+m.id+'\', 3)"><span>🟢</span><span>+3 تشجيع</span></button>'+
        '<button class="blue-btn" onclick="addManualPoints(\''+m.id+'\', 5)"><span>🔵</span><span>+5 مشاركة</span></button>'+
        '<button class="red-btn" onclick="addManualPoints(\''+m.id+'\', 10)"><span>🔴</span><span>+10 تفوق وخدمة</span></button>'+
      '</div>'+
    '</div>';
  }).join('');

  v.innerHTML = '<h3 class="sec-title">⭐ شجرة النمو الروحي للمخدومين</h3>' + (items || '<p class="empty">لا يوجد مخدومين مسجلين</p>');
}
function addManualPoints(memberId, pts){
  var log = get('points', []);
  log.push({ id: uid(), memberId: memberId, points: pts, reason: 'مكافأة تشجيعية من الخادم', date: Date.now() });
  set('points', log);
  toast('✅ تم منح ' + pts + ' نقاط بنجاح!');
  viewPoints($('#view'));
}

function viewNotifications(v){
  var notifs = get('notifs', []);
  var list = notifs.map(function(n){
    return '<div class="notif"><h4>🔔 '+esc(n.title)+'</h4><p>'+esc(n.body)+'</p><small>'+fmtTime(n.date)+' • ✍️ '+esc(n.author)+'</small></div>';
  }).join('');

  v.innerHTML = '<div class="card">'+
      '<h3>✍️ إرسال إشعار فوري جديد</h3>'+
      '<form id="notifSendForm">'+
        '<label>عنوان التنبيه<input name="title" required placeholder="مثال: موعد لقاء الخميس القادم"></label>'+
        '<label>نص الرسالة<textarea name="body" rows="3" required placeholder="اكتب نص الإشعار هنا..."></textarea></label>'+
        '<button class="btn primary" type="submit">📢 إرسال لجميع الأجهزة</button>'+
      '</form>'+
    '</div>'+
    '<h3 class="sec-title">🔔 سجل الإشعارات ('+notifs.length+')</h3>'+
    (list || '<p class="empty">لا توجد إشعارات سابقة</p>');

  document.getElementById('notifSendForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target;
    var arr = get('notifs', []);
    arr.unshift({ id: uid(), title: f.title.value.trim(), body: f.body.value.trim(), author: state.user.name, date: Date.now() });
    set('notifs', arr);
    toast('✅ تم إرسال الإشعار لجميع الأجهزة فوراً');
    f.reset();
    viewNotifications(v);
  });
}

function sendQuickBroadcast(){
  var msg = prompt('📢 اكتب نص الإشعار السريع لإرساله فوراً للجميع:');
  if(!msg || !msg.trim()) return;
  var arr = get('notifs', []);
  arr.unshift({ id: uid(), title: 'تنبيه عاجل من أمانة الخدمة', body: msg.trim(), author: (state.user ? state.user.name : 'أمين الخدمة'), date: Date.now() });
  set('notifs', arr);
  toast('✅ تم بث الإشعار بنجاح');
  updateBell();
}

function viewAdmin(v){
  var users = get('users', []);
  var rows = users.map(function(u){
    return '<tr><td><b>'+esc(u.name)+'</b></td><td>'+esc(u.username)+'</td><td>'+roleChip(u.role)+'</td><td>'+esc(u.phone||'—')+'</td><td>'+(u.active?'<span class="tag" style="background:#d1fae5;color:#065f46">مفعل</span>':'<span class="tag" style="background:#fee2e2;color:#991b1b">معلق</span>')+'</td></tr>';
  }).join('');

  v.innerHTML = '<div class="card">'+
      '<div class="card-head"><h3 style="margin:0">👥 إدارة مستخدمي المنصة والحسابات ('+users.length+')</h3><button class="btn small primary" onclick="refreshDataOnline()">🔄 تحديث الحسابات</button></div>'+
      '<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصفة</th><th>الهاتف</th><th>الحالة</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="card">'+
      '<h3>🗄️ النسخ الاحتياطي</h3>'+
      '<button class="btn primary" onclick="downloadBackup()">⬇️ تحميل نسخة احتياطية من البيانات (JSON)</button>'+
    '</div>';
}

function downloadBackup(){
  var data = {};
  KEYS.forEach(function(k){ data[k] = get(k, null); });
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'st-verena-backup-'+todayStr()+'.json'; a.click();
}

function downloadCurrentHTML(){
  var htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  var blob = new Blob([htmlContent], {type: 'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function updateBell(){
  var b = document.getElementById('bellBadge');
  if(!b) return;
  var notifs = get('notifs', []);
  if(notifs.length > 0){ b.textContent = notifs.length; b.style.display = 'flex'; }
  else { b.style.display = 'none'; }
}

try { init(); } catch(e){ console.error(e); }
