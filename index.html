<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛪ اجتماع الشابات الأسبوعي — أسرة القديسة فيرينا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#5b21b6;--primary-light:#7c3aed;--accent:#f59e0b;--success:#059669;--success-light:#10b981;--danger:#dc2626;--text:#1c1838;--text-2:#6b6880;--text-3:#9d99b5;--border:#ece7f7;--border-2:#e2dcf0;--shadow-sm:0 2px 8px rgba(91,33,182,.06);--shadow-md:0 8px 24px rgba(91,33,182,.10);--radius:16px;--radius-lg:22px;--radius-pill:999px}
html,body{height:100%}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f7f5fc 0%,#fdf8f0 100%);background-attachment:fixed;color:var(--text);line-height:1.7;min-height:100vh}
.hidden{display:none!important}
h2,h3,h4,h5{font-weight:800}
input,select,textarea,button{font-family:inherit;font-size:14.5px;color:inherit}
input,select,textarea{padding:11px 14px;border:1.5px solid var(--border-2);border-radius:12px;width:100%;background:#fbfaff;transition:.2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
label{display:block;margin-bottom:12px;font-size:13.5px;font-weight:600;color:var(--text-2)}
label input,label select,label textarea{margin-top:6px;font-weight:500}
.btn{padding:10px 18px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:13.5px;transition:.2s;background:#ede9fe;color:var(--primary);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 6px 16px rgba(91,33,182,.28)}
.btn.green{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn.amber{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn.red{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--border-2);color:var(--text-2)}
.btn.small{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%;margin-top:10px;padding:12px}

/* Auth Screens */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1e0a3c,#4c1d95 40%,#6d28d9)}
.auth-wrap::before,.auth-wrap::after{content:'';position:absolute;border-radius:50%;filter:blur(90px);opacity:.4}
.auth-wrap::before{width:500px;height:500px;background:#fbbf24;top:-150px;left:-150px}
.auth-wrap::after{width:600px;height:600px;background:#ec4899;bottom:-200px;right:-200px}
.auth-card{position:relative;z-index:2;background:rgba(255,255,255,.98);padding:32px 28px;border-radius:24px;width:100%;max-width:500px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto}
.auth-card .brand{text-align:center;font-size:21px;font-weight:900;color:var(--primary);margin-bottom:4px}
.auth-card .church-name{text-align:center;font-size:13px;color:var(--text-2);font-weight:600;margin-bottom:12px}
.role-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.role-pill{padding:10px 6px;border-radius:14px;border:1.5px solid var(--border-2);background:#fbfaff;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--text-2);text-align:center;transition:.2s}
.role-pill.active{background:linear-gradient(135deg,#ede9fe,#fef3c7);border-color:var(--primary);color:var(--primary);box-shadow:0 4px 12px rgba(91,33,182,.15)}
.pw-field{position:relative}
.pw-toggle{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-3);padding:4px}

/* Main Top Bar & Tabs */
.topbar{background:linear-gradient(135deg,#2e1065,#5b21b6 50%,#7c3aed);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
.topbar .brand{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.top-actions{display:flex;align-items:center;gap:8px}
.chip{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.2)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 16px;border-radius:var(--radius-pill);border:1.5px solid transparent;background:#f3eeff;cursor:pointer;font-weight:700;font-size:13px;color:var(--text-2);transition:.2s}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 14px rgba(91,33,182,.3)}
.view{padding:20px;max-width:1150px;margin:0 auto}
.card{background:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--primary)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* Stats */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{border-radius:var(--radius);padding:18px 14px;text-align:center;color:#fff;box-shadow:var(--shadow-md)}
.stat:nth-child(1){background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.stat:nth-child(2){background:linear-gradient(135deg,#0891b2,#22d3ee)}
.stat:nth-child(3){background:linear-gradient(135deg,#d97706,#fbbf24)}
.stat:nth-child(4){background:linear-gradient(135deg,#059669,#10b981)}
.stat-num{font-size:32px;font-weight:900}
.stat-lbl{font-size:12.5px;font-weight:600;opacity:.95}

/* Table & Badges */
.table-wrap{overflow-x:auto;max-height:500px;overflow-y:auto;border-radius:14px;border:1px solid var(--border);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--border)}
th{background:#faf8ff;color:var(--text-2);font-size:12px;font-weight:800;white-space:nowrap}
.points-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--radius-pill);font-weight:800;font-size:11.5px;color:#fff}
.points-badge.green{background:linear-gradient(135deg,#059669,#10b981)}
.points-badge.blue{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.points-badge.red{background:linear-gradient(135deg,#dc2626,#ef4444)}

/* QR Badges Printable */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.qr-badge-card{background:#fff;border:2px dashed var(--border-2);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow-sm)}
.qr-badge-card .qr-code-box{margin:10px auto;width:120px;height:120px;display:flex;align-items:center;justify-content:center}

/* Floating Clean Download Button */
.download-btn-fixed{position:fixed;bottom:20px;left:20px;z-index:999;background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(5,150,105,.4);display:flex;align-items:center;gap:8px;border:none;cursor:pointer;transition:.2s}
.download-btn-fixed:hover{transform:scale(1.05)}

/* Notifications / Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1c1838,#3a3466);color:#fff;padding:12px 20px;border-radius:12px;z-index:9999;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.empty{color:var(--text-3);text-align:center;padding:28px 16px;font-size:13.5px;background:#fafaff;border-radius:14px;border:1.5px dashed var(--border-2);font-weight:600}

@media print{
  body{background:#fff!important}
  .topbar,.tabs,.download-btn-fixed,.no-print{display:none!important}
  .view{padding:0!important;max-width:100%!important}
  .card{border:none!important;box-shadow:none!important;padding:0!important}
  .qr-grid{grid-template-columns:repeat(3,1fr)!important;gap:15px!important}
  .qr-badge-card{border:1px solid #ccc!important;page-break-inside:avoid}
}
</style>
</head>
<body>

<!-- زر تحميل الكود المباشر العائم -->
<button class="download-btn-fixed no-print" onclick="downloadCurrentFile()">
  <span>📥 تنزيل كود المنصة النظيف (index.html)</span>
</button>

<!-- شاشة تسجيل الدخول -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">🌸 اجتماع الشابات الأسبوعي</div>
    <div class="church-name">أسرة القديسة فيرينا — كنيسة القديس الأنبا صموئيل المعترف بأبيس الثورة</div>

    <div class="role-pills">
      <div class="role-pill active" onclick="setAuthRole('leader', this)">👑 الأمينة</div>
      <div class="role-pill" onclick="setAuthRole('servant', this)">🙋‍♀️ خادمة</div>
      <div class="role-pill" onclick="setAuthRole('member', this)">🌸 شابة</div>
    </div>

    <div id="loginBox">
      <form id="loginForm" autocomplete="off">
        <label>اسم المستخدم / رقم الهاتف
          <input name="username" id="loginUsername" required placeholder="اكتب اسم المستخدم أو الهاتف" autocomplete="off">
        </label>
        <label>كلمة المرور
          <div class="pw-field">
            <input type="password" name="password" id="loginPassword" required placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePassword('loginPassword', this)">👁️</button>
          </div>
        </label>
        <button class="btn primary block" type="submit">🔐 تسجيل الدخول الآمن</button>
      </form>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn ghost block" onclick="showRegister('member')">🌸 تسجيل شابة جديدة</button>
        <button class="btn ghost block" onclick="showRegister('servant')">📝 تسجيل خادمة جديدة</button>
      </div>
    </div>

    <!-- نموذج تسجيل جديد مصفّر -->
    <div id="registerBox" style="display:none">
      <h3 id="regTitle" style="color:var(--primary);margin-bottom:12px;font-size:16px">🌸 تسجيل شابة جديدة</h3>
      <form id="registerForm" autocomplete="off">
        <input type="hidden" name="role" id="regRole" value="member">
        <label>الاسم ثلاثي *<input name="name" required placeholder="اسم الشابة بالكامل" autocomplete="off"></label>
        <label>رقم الهاتف (واتساب) *<input name="phone" required placeholder="01xxxxxxxxx" autocomplete="off"></label>
        <label>اسم المستخدم *<input name="username" required placeholder="اختر اسم مستخدم للدخول" autocomplete="off"></label>
        <label>كلمة المرور *
          <div class="pw-field">
            <input type="password" name="password" id="regPassword" required placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePassword('regPassword', this)">👁️</button>
          </div>
        </label>
        <label>أب الاعتراف<input name="confessionFather" placeholder="اسم قدس أبونا"></label>
        <label>المرحلة / الكلية / العمل<input name="education" placeholder="مثال: كلية صيدلة / خريجة"></label>
        <button class="btn green block" type="submit">✅ إنشاء الحساب والتسجيل</button>
      </form>
      <button class="btn ghost block" onclick="showLogin()">رجوع لتسجيل الدخول</button>
    </div>
  </div>
</div>

<!-- الشاشة الرئيسية للمنصة -->
<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">⛪ اجتماع الشابات — أسرة القديسة فيرينا</div>
    <div class="top-actions">
      <span id="userChip" class="chip"></span>
      <button class="btn small red" onclick="logout()">خروج</button>
    </div>
  </header>

  <nav id="tabs" class="tabs no-print">
    <button class="active" onclick="goTab('home', this)">🏠 الرئيسية</button>
    <button onclick="goTab('members', this)">👥 سجل الشابات (0)</button>
    <button onclick="goTab('attendance', this)">✅ رصد الحضور</button>
    <button onclick="goTab('qr', this)">📱 باركود QR والطباعة</button>
    <button onclick="goTab('tree', this)">🌱 شجرة النمو</button>
    <button onclick="goTab('admin', this)">⚙️ الإدارة والتصفير</button>
  </nav>

  <main id="view" class="view"></main>
</div>

<script>
// حالة النظام المصفّرة والنظيفة بالكامل
var DB_KEY = 'verena_clean_db_v1';
var defaultDB = {
  users: [
    { id: 'u_amena', name: 'أ. نيفين فؤاد (أمينة الخدمة)', username: 'amena', password: '2805022', role: 'leader', phone: '0122805022' },
    { id: 'u_admin', name: 'المشرف العام (Admin)', username: 'admin', password: 'admin123', role: 'admin', phone: '' }
  ],
  members: [], // مصفّر تماماً
  attendance: [], // مصفّر
  points: [], // مصفّر
  settings: { pPresent: 10, pLate: 5, pExcused: 1, pAbsent: 0 }
};

var db = (function(){
  try {
    var raw = localStorage.getItem(DB_KEY);
    return raw ? JSON.parse(raw) : defaultDB;
  } catch(e){
    return defaultDB;
  }
})();

function saveDB(){
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch(e){}
}

var state = { currentUser: null, activeTab: 'home', authRole: 'leader' };

function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3000);
}

function togglePassword(id, btn){
  var input = document.getElementById(id);
  if(!input) return;
  if(input.type === 'password'){
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function setAuthRole(r, btn){
  state.authRole = r;
  var pills = document.querySelectorAll('.role-pill');
  pills.forEach(function(p){ p.classList.remove('active'); });
  if(btn) btn.classList.add('active');
}

function showLogin(){
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('registerBox').style.display = 'none';
}

function showRegister(role){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('registerBox').style.display = 'block';
  document.getElementById('regRole').value = role;
  document.getElementById('regTitle').textContent = role === 'servant' ? '📝 تسجيل خادمة جديدة' : '🌸 تسجيل شابة جديدة';
  document.getElementById('registerForm').reset();
}

// تسجيل الدخول
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var u = document.getElementById('loginUsername').value.trim();
  var p = document.getElementById('loginPassword').value;
  var user = null;
  for(var i=0; i<db.users.length; i++){
    if((db.users[i].username === u || db.users[i].phone === u) && db.users[i].password === p){
      user = db.users[i];
      break;
    }
  }
  if(user){
    state.currentUser = user;
    toast('✅ مرحباً بكِ ' + user.name);
    startApp();
  } else {
    alert('❌ اسم المستخدم أو كلمة المرور غير صحيحة');
  }
});

// تسجيل جديد مصفّر
document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  var name = f.name.value.trim();
  var phone = f.phone.value.trim();
  var username = f.username.value.trim();
  var password = f.password.value;
  var role = f.role.value;
  var confession = f.confessionFather.value.trim();
  var education = f.education.value.trim();

  // التحقق من تكرار اسم المستخدم
  for(var i=0; i<db.users.length; i++){
    if(db.users[i].username === username){
      alert('⚠️ اسم المستخدم مسجل مسبقاً، يرجى اختيار اسم آخر');
      return;
    }
  }

  var uid = 'u_' + Date.now();
  var newUser = { id: uid, name: name, phone: phone, username: username, password: password, role: role };
  db.users.push(newUser);

  var mid = 'm_' + Date.now();
  db.members.push({
    id: mid,
    userId: uid,
    name: name,
    phone: phone,
    role: role,
    confessionFather: confession,
    education: education,
    created: Date.now()
  });

  saveDB();
  toast('✅ تم إنشاء الحساب بنجاح!');
  showLogin();
});

function startApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('userChip').textContent = state.currentUser.name + ' (' + (state.currentUser.role === 'leader' ? 'الأمينة' : state.currentUser.role === 'servant' ? 'خادمة' : 'شابة') + ')';
  renderView();
}

function logout(){
  state.currentUser = null;
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginForm').reset();
}

function goTab(t, btn){
  state.activeTab = t;
  var btns = document.querySelectorAll('#tabs button');
  btns.forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  renderView();
}

function renderView(){
  var v = document.getElementById('view');
  var mCount = db.members.length;
  // تحديث عداد التبويب
  var memTab = document.querySelectorAll('#tabs button')[1];
  if(memTab) memTab.textContent = '👥 سجل الشابات (' + mCount + ')';

  if(state.activeTab === 'home'){
    v.innerHTML = 
      '<div class="grid-stats">' +
        '<div class="stat"><div class="stat-num">' + mCount + '</div><div class="stat-lbl">إجمالي الشابات المسجلات</div></div>' +
        '<div class="stat"><div class="stat-num">0</div><div class="stat-lbl">حضور لقاء الخميس اليوم</div></div>' +
        '<div class="stat"><div class="stat-num">0</div><div class="stat-lbl">الغياب</div></div>' +
        '<div class="stat"><div class="stat-num">0</div><div class="stat-lbl">مجموع نقاط النمو</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>🌸 حالة المنصة: نظيفة ومصفّرة بالكامل (Ready from Scratch)</h3>' +
        '<p style="color:var(--text-2);margin-bottom:12px">كافة سجلات الأسماء والغياب والنقاط السابقة تم تصفيرها بنجاح لتبدأ الخدمة نظيفة تماماً تحت اسم <b>«اجتماع الشابات — أسرة القديسة فيرينا»</b>.</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn primary" onclick="goTab(\'members\', document.querySelectorAll(\'#tabs button\')[1])">➕ إضافة وتسجيل شابة جديدة</button>' +
          '<button class="btn amber" onclick="goTab(\'qr\', document.querySelectorAll(\'#tabs button\')[3])">🖨️ طباعة بطاقات QR المجمعة</button>' +
        '</div>' +
      '</div>';
  }
  else if(state.activeTab === 'members'){
    var rows = '';
    for(var i=0; i<db.members.length; i++){
      var m = db.members[i];
      rows += '<tr>' +
        '<td>' + (i+1) + '</td>' +
        '<td><b>' + m.name + '</b></td>' +
        '<td>' + (m.phone || '—') + '</td>' +
        '<td>' + (m.role === 'servant' ? '🙋‍♀️ خادمة' : '🌸 شابة') + '</td>' +
        '<td>' + (m.confessionFather || '—') + '</td>' +
        '<td>' + (m.education || '—') + '</td>' +
        '<td><button class="btn small red" onclick="delMember(\'' + m.id + '\')">🗑️</button></td>' +
      '</tr>';
    }
    v.innerHTML = 
      '<div class="card">' +
        '<div class="card-head">' +
          '<h3 style="margin:0">👥 سجل المخدومات والشابات (' + mCount + ')</h3>' +
          '<button class="btn primary small" onclick="openAddMemberModal()">➕ إضافة شابة</button>' +
        '</div>' +
        (mCount > 0 ? 
          '<div class="table-wrap"><table><thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>الصفة</th><th>أب الاعتراف</th><th>المرحلة</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<div class="empty">🌱 لا توجد شابات مسجلات حالياً (البيانات مصفّرة وجاهزة للإدخال).</div>') +
      '</div>';
  }
  else if(state.activeTab === 'attendance'){
    v.innerHTML = 
      '<div class="card">' +
        '<h3>✅ تسجيل الحضور التفاعلي</h3>' +
        '<p class="empty">' + (mCount === 0 ? 'يرجى تسجيل الشابات أولاً من تبويب (سجل الشابات) لتتمكني من رصد حضورهن.' : 'سجل الشابات جاهز لرصد حضور لقاء الخميس.') + '</p>' +
      '</div>';
  }
  else if(state.activeTab === 'qr'){
    var cards = '';
    for(var j=0; j<db.members.length; j++){
      var mem = db.members[j];
      cards += '<div class="qr-badge-card">' +
        '<b>' + mem.name + '</b>' +
        '<div style="font-size:12px;color:var(--text-3)">' + (mem.role === 'servant' ? 'خادمة' : 'شابة') + ' • ' + (mem.phone||'') + '</div>' +
        '<div class="qr-code-box" id="qr_' + mem.id + '"></div>' +
        '<div style="font-size:11px;color:var(--primary);font-weight:700">أسرة القديسة فيرينا</div>' +
      '</div>';
    }
    v.innerHTML = 
      '<div class="card no-print">' +
        '<div class="card-head">' +
          '<h3 style="margin:0">📱 بطاقات QR الذكية للطباعة والرصد</h3>' +
          '<button class="btn amber" onclick="window.print()">🖨️ طباعة بطاقات A4</button>' +
        '</div>' +
        '<p style="color:var(--text-2);font-size:13px">يمكنك طباعة البطاقات المجمعة للشابات وتوزيعها عليهن ليتم مسحها بكاميرا الموبايل فور دخولهن الاجتماع.</p>' +
      '</div>' +
      (mCount > 0 ? '<div class="qr-grid">' + cards + '</div>' : '<div class="card"><div class="empty">سجّلي الشابات أولاً لتوليد كروت الـ QR تلقائياً.</div></div>');

    // توليد رموز QR
    setTimeout(function(){
      for(var k=0; k<db.members.length; k++){
        var box = document.getElementById('qr_' + db.members[k].id);
        if(box && typeof QRCode !== 'undefined'){
          box.innerHTML = '';
          new QRCode(box, { text: 'CH_ATT:' + db.members[k].id, width: 110, height: 110 });
        }
      }
    }, 100);
  }
  else if(state.activeTab === 'tree'){
    v.innerHTML = 
      '<div class="card" style="text-align:center">' +
        '<h3>🌱 شجرة النمو الروحي والنقاط التحفيزية</h3>' +
        '<p style="color:var(--text-2)">تبدأ كل شابة من بذرة صغيرة 🌱 وتنمو شجرتها مع التزام الحضور وحفظ الألحان والقراءات ومسابقات العظة.</p>' +
        '<div style="margin:24px 0;font-size:72px">🌱</div>' +
        '<div style="font-weight:800;font-size:24px;color:var(--primary)">مرحلة البذرة (0 نقاط)</div>' +
      '</div>';
  }
  else if(state.activeTab === 'admin'){
    v.innerHTML = 
      '<div class="card">' +
        '<h3>⚙️ لوحة إدارة المنصة والنسخ الاحتياطي</h3>' +
        '<p style="color:var(--text-2);margin-bottom:16px">بيانات الأمينة الحالية: <b>amena</b> | كلمة المرور: <b>2805022</b></p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn green" onclick="downloadCurrentFile()">📥 تنزيل كود المنصة الكامل (index.html)</button>' +
          '<button class="btn red" onclick="resetToZero()">🧹 إعادة تصفير كافة البيانات من الصفر</button>' +
        '</div>' +
      '</div>';
  }
}

function openAddMemberModal(){
  var name = prompt('اكتبي اسم الشابة ثلاثي:');
  if(!name || !name.trim()) return;
  var phone = prompt('رقم الهاتف (واتساب):') || '';
  var confession = prompt('اسم أب الاعتراف:') || '';

  var mid = 'm_' + Date.now();
  db.members.push({
    id: mid,
    name: name.trim(),
    phone: phone.trim(),
    role: 'member',
    confessionFather: confession.trim(),
    education: '',
    created: Date.now()
  });
  saveDB();
  toast('✅ تم إضافة الشابة بنجاح');
  renderView();
}

function delMember(id){
  if(!confirm('هل تودين حذف هذه الشابة من السجل؟')) return;
  db.members = db.members.filter(function(m){ return m.id !== id; });
  saveDB();
  toast('🗑️ تم الحذف');
  renderView();
}

function resetToZero(){
  if(!confirm('⚠️ تأكيد: هل تريدين تصفير وحذف جميع الأسماء والبيانات المسجلة نهائياً؟')) return;
  db.members = [];
  db.attendance = [];
  db.points = [];
  saveDB();
  toast('✅ تم التصفير بالكامل');
  renderView();
}

// تنزيل ملف الـ HTML المصدري النظيف محلياً
function downloadCurrentFile(){
  var content = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('✅ تم بدء تنزيل ملف index.html على جهازك');
}
</script>

</html>
