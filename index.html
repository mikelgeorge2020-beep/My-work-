<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛪ كنيسة الأنبا صموئيل المعترف بأبيس الثورة - اجتماع الخميس أسرة القديسة فيرينا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#5b21b6;
  --primary-light:#7c3aed;
  --primary-subtle:#ede9fe;
  --accent:#d97706;
  --accent-light:#f59e0b;
  --success:#059669;
  --success-light:#10b981;
  --danger:#dc2626;
  --text:#1e1b4b;
  --text-2:#4c4870;
  --text-3:#8683a3;
  --border:#e4def2;
  --border-2:#d4cbe8;
  --bg-page:#f8f6fc;
  --shadow-sm:0 2px 8px rgba(91,33,182,.06);
  --shadow-md:0 8px 24px rgba(91,33,182,.10);
  --shadow-lg:0 16px 40px rgba(91,33,182,.16);
  --radius:16px;
  --radius-lg:22px;
  --radius-pill:999px;
}
html,body{height:100%}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f5f2fb 0%,#fbf7f0 100%);background-attachment:fixed;color:var(--text);line-height:1.7;min-height:100vh}
.hidden{display:none!important}
h2,h3,h4{font-weight:800}
input,select,textarea,button{font-family:inherit;font-size:14.5px;color:inherit}
input,select,textarea{padding:11px 14px;border:1.5px solid var(--border-2);border-radius:12px;width:100%;background:#fbfaff;transition:.2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.12)}
label{display:block;margin-bottom:12px;font-size:13.5px;font-weight:700;color:var(--text-2)}
label input,label select,label textarea{margin-top:6px;font-weight:500}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-left:42px}
.pw-toggle{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-3);padding:4px;display:flex;align-items:center;justify-content:center;transition:.2s}
.pw-toggle:hover{color:var(--primary)}
.btn{padding:11px 20px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s;background:#ede9fe;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 6px 18px rgba(91,33,182,.28)}
.btn.green{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.btn.amber{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
.btn.red{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--border-2);color:var(--text-2)}
.btn.small{padding:7px 14px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%;margin-top:10px;padding:12px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2e1065,#5b21b6 40%,#7c3aed)}
.auth-card{position:relative;z-index:2;background:rgba(255,255,255,.98);padding:34px 30px;border-radius:26px;width:100%;max-width:540px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh;overflow-y:auto}
.auth-card .brand{text-align:center;font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.auth-card .subtitle{text-align:center;font-size:13px;color:var(--text-2);font-weight:700;margin-bottom:14px}
.auth-card .divider{width:60px;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;margin:10px auto 20px}
.err{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:14px;border-right:4px solid var(--danger)}
.topbar{background:linear-gradient(135deg,#2e1065,#5b21b6 50%,#7c3aed);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:12px;box-shadow:0 4px 18px rgba(46,16,101,.2)}
.topbar .brand{font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.top-actions{display:flex;align-items:center;gap:10px}
.chip{background:rgba(255,255,255,.16);padding:7px 15px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.25)}
.bell{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;left:-4px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:13px 22px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--border);position:sticky;top:70px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:9px 18px;border-radius:var(--radius-pill);border:1.5px solid transparent;background:#f3eeff;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--text-2);transition:.2s}
.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 6px 16px rgba(91,33,182,.3)}
.view{padding:24px;max-width:1180px;margin:0 auto}
.card{background:#fff;border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);transition:.2s}
.card:hover{box-shadow:var(--shadow-md)}
.card h3{font-size:16.5px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat{border-radius:var(--radius);padding:20px 18px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md);transition:.25s}
.stat:hover{transform:translateY(-3px)}
.stat:nth-child(1){background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.stat:nth-child(2){background:linear-gradient(135deg,#0891b2,#22d3ee)}
.stat:nth-child(3){background:linear-gradient(135deg,#d97706,#fbbf24)}
.stat:nth-child(4){background:linear-gradient(135deg,#059669,#10b981)}
.stat-num{font-size:32px;font-weight:900}
.stat-lbl{font-size:12.5px;font-weight:700;opacity:.92;margin-top:2px}
.month-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}
.month-btn{padding:8px 16px;border-radius:var(--radius-pill);border:1.5px solid var(--border-2);background:#fff;cursor:pointer;font-weight:700;font-size:13px;color:var(--text-2);white-space:nowrap}
.month-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(91,33,182,.25)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.cal-head{text-align:center;font-weight:800;font-size:12px;color:var(--text-3);padding:6px 0}
.cal-day{min-height:85px;background:#faf9fd;border-radius:12px;border:1px solid var(--border);padding:8px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.cal-day:hover{border-color:var(--primary-light);background:#fff}
.cal-day.thursday{background:#f5f0ff;border-color:#d8b4fe}
.cal-day.today{border:2px solid var(--primary);background:#fff}
.cal-tag{font-size:10.5px;padding:2px 6px;border-radius:6px;font-weight:800;margin-top:4px;display:inline-block;text-align:center}
.cal-tag.meeting{background:#ede9fe;color:#5b21b6}
.cal-tag.feast{background:#fef3c7;color:#92400e}
.thursday-card{background:#fff;border-radius:16px;border:1.5px solid var(--border);padding:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;transition:.2s}
.thursday-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-sm)}
.thursday-card.active-meet{border-right:6px solid #5b21b6;background:linear-gradient(135deg,#fff,#faf7ff)}
.table-wrap{overflow-x:auto;max-height:520px;overflow-y:auto;border-radius:14px;border:1px solid var(--border);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--border)}
th{background:#faf8ff;color:var(--text-2);font-size:12px;font-weight:800;white-space:nowrap}
tr:hover td{background:#fcfbff}
.att-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.att-opts{display:flex;gap:6px;flex-wrap:wrap}
.att-opts label{display:flex;align-items:center;gap:4px;margin:0;padding:6px 12px;border:1.5px solid var(--border-2);border-radius:var(--radius-pill);cursor:pointer;font-size:12px;background:#fff;font-weight:700;color:var(--text-2)}
.att-opts input{display:none}
.att-opts label.on.present{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border-color:transparent}
.att-opts label.on.late{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;border-color:transparent}
.att-opts label.on.excused{background:linear-gradient(135deg,#0891b2,#22d3ee);color:#fff;border-color:transparent}
.att-opts label.on.absent{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent}
.points-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--radius-pill);font-weight:800;font-size:12px;color:#fff}
.points-badge.green{background:linear-gradient(135deg,#059669,#10b981)}
.points-badge.blue{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.points-badge.red{background:linear-gradient(135deg,#dc2626,#ef4444)}
.point-action{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.point-action button{padding:16px 12px;border-radius:16px;border:none;cursor:pointer;font-weight:800;font-size:15px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.point-action button.green-btn{background:linear-gradient(135deg,#059669,#10b981)}
.point-action button.blue-btn{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.point-action button.red-btn{background:linear-gradient(135deg,#dc2626,#ef4444)}
.tree-box{text-align:center;background:linear-gradient(180deg,#f5f2fb,#fdf6ec);border-radius:20px;padding:16px;border:1.5px solid var(--border)}
.big-points{font-size:48px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1;margin-top:6px}
.progress{height:12px;background:#ede9fe;border-radius:var(--radius-pill);overflow:hidden;margin:12px 0 8px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:var(--radius-pill);transition:.5s}
.notif{border-radius:16px;background:#fff;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);border-right:5px solid var(--primary-light)}
.notif.unread{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-right-color:var(--accent)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,27,75,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:22px;padding:26px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1e1b4b,#3b2d71);color:#fff;padding:12px 22px;border-radius:14px;z-index:9999;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.download-source-btn{position:fixed;bottom:20px;right:20px;z-index:999;background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:13.5px;box-shadow:0 8px 24px rgba(5,150,105,.4);display:flex;align-items:center;gap:8px;border:none;cursor:pointer;transition:.2s}
.download-source-btn:hover{transform:scale(1.04)}
.avatar-placeholder{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid #fff}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;margin-left:6px;box-shadow:0 0 8px #10b981;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.role-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.role-chip.member{background:#dbeafe;color:#1e40af}
.role-chip.servant{background:#fef3c7;color:#92400e}
.role-chip.leader{background:#d1fae5;color:#065f46}
.role-chip.admin{background:#fee2e2;color:#991b1b}
.banner-church{background:linear-gradient(135deg,#ede9fe,#fef3c7);border:1.5px solid #ddd6fe;border-radius:16px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">⛪ كنيسة الأنبا صموئيل المعترف بأبيس الثورة</div>
    <div class="subtitle">اجتماع الخميس أسرة القديسة فيرينا</div>
    <div class="divider"></div>

    <div id="loginBox">
      <h2 style="font-size:17px;margin-bottom:16px;text-align:center;color:var(--text-2)">تسجيل الدخول</h2>
      <div id="loginErr" class="err" style="display:none"></div>
      <form id="loginForm" autocomplete="off">
        <label>اسم المستخدم
          <input name="username" required placeholder="اسم المستخدم" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </label>
        <label>كلمة المرور
          <div class="pw-wrap">
            <input type="password" id="loginPw" name="password" required placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePw('loginPw', this)" title="إظهار / إخفاء">👁️</button>
          </div>
        </label>
        <button class="btn primary block" type="submit">دخول</button>
      </form>
      <button class="btn ghost block" onclick="showRegister()">تسجيل بيانات جديدة</button>
    </div>

    <div id="registerBox" style="display:none">
      <h2 style="font-size:17px;margin-bottom:16px;text-align:center;color:var(--text-2)">📝 تسجيل بيانات جديدة</h2>
      <form id="registerForm" autocomplete="off">
        <label>الاسم بالكامل *<input name="name" required autocomplete="off"></label>
        <label>اسم المستخدم *<input name="username" required autocomplete="off"></label>
        <label>كلمة المرور *
          <div class="pw-wrap">
            <input type="password" id="regPw" name="password" required autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePw('regPw', this)">👁️</button>
          </div>
        </label>
        <label>تأكيد كلمة المرور *
          <div class="pw-wrap">
            <input type="password" id="regPw2" name="password2" required autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePw('regPw2', this)">👁️</button>
          </div>
        </label>
        <label>رقم الهاتف *<input name="phone" required placeholder="01xxxxxxxxx"></label>
        <label>أب الاعتراف<input name="confessionFather" placeholder="اسم أب الاعتراف"></label>
        <label>المرحلة التعليمية / الوظيفة<input name="jobOrEdu" placeholder="مثال: جامعي / مهندس"></label>
        <button class="btn primary block" type="submit">✅ إنشاء الحساب</button>
      </form>
      <button class="btn ghost block" onclick="showLogin()">رجوع</button>
    </div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span>⛪ كنيسة الأنبا صموئيل المعترف - اجتماع الخميس أسرة فيرينا</span>
      <span class="live-dot" title="متصل ومزامن"></span>
    </div>
    <div class="top-actions">
      <button class="btn amber small" onclick="openSendNotifModal()">📢 إرسال إشعار</button>
      <button class="bell" onclick="go('notifications')">🔔<span id="bellBadge" class="badge" style="display:none">0</span></button>
      <span id="userChip" class="chip"></span>
      <button class="btn small ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="logout()">خروج</button>
    </div>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="view" class="view"></main>
</div>

<div id="modalRoot"></div>

<button class="download-source-btn" onclick="downloadSelfHTML()">
  <span>📥</span>
  <span>تنزيل ملف index.html</span>
</button>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDopFwnPp3oS2UnMXt9YEHGOLFQmpR4-Dk",
  authDomain: "stmariam-1fdc0.firebaseapp.com",

  projectId: "stmariam-1fdc0",

  messagingSenderId: "105645960370",
  appId: "1:105645960370:web:cb11fb7fc5bbea9cbdedab"
};
var fdb = null, firebaseOk = false;
var cache = {};
var KEYS = ['users','members','attendance','points','thursdays','notifs','settings','readings','media'];

function initFirebase(){
  try { firebase.initializeApp(firebaseConfig); fdb = firebase.database(); firebaseOk = true; }
  catch(e){ firebaseOk = false; }
}
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).substring(2,7); }
function K(p){ return 'chm_samuel_' + p; }
function esc(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}); }

function initial(name){ return name && name.length ? name.charAt(0) : '؟'; }
function toast(msg){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3000); }
function get(k, def){ return (cache[k] === undefined || cache[k] === null) ? def : cache[k]; }
function set(k, v){
  cache[k] = v;
  try { localStorage.setItem(K(k), JSON.stringify(v)); } catch(e){}
  if(firebaseOk && fdb){ fdb.ref('chm_samuel/' + k).set(v).catch(function(){}); }
}

function togglePw(id, btn){
  var el = document.getElementById(id);
  if(!el) return;
  if(el.type === 'password'){ el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁️'; }

var state = { user: null, tab: 'home', pointMember: null, selectedMonth: 3 }; // شهر أبريل افتراضياً
var AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function init(){
  KEYS.forEach(function(k){ try { var v = localStorage.getItem(K(k)); if(v !== null) cache[k] = JSON.parse(v); } catch(e){} });
  initFirebase();
  if(!cache.users || !cache.users.length){
    cache.users = [
      { id: 'u_leader', name:'نيفين فؤاد (الأمينة)', username:'amena', password:'2805022', role:'leader', active:true, created:Date.now() },

function showLogin(){
  $('#authScreen').classList.remove('hidden');
  $('#appScreen').classList.add('hidden');
  $('#loginBox').style.display = 'block';
  $('#registerBox').style.display = 'none';
}
function showRegister(){
  $('#loginBox').style.display = 'none';
  $('#registerBox').style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var u = this.username.value.trim(), p = this.password.value;
  var users = get('users', []);
  var found = null;
  for(var i=0;i<users.length;i++){ if(users[i].username === u && users[i].password === p){ found = users[i]; break; } }
  if(!found){ $('#loginErr').textContent = '⚠️ اسم المستخدم أو كلمة المرور غير صحيحة'; $('#loginErr').style.display = 'block'; return; }
  if(found.active === false){ $('#loginErr').textContent = '⚠️ الحساب بانتظار موافقة الإدارة'; $('#loginErr').style.display = 'block'; return; }
  $('#loginErr').style.display = 'none';
  state.user = found;
  set('session', found.id);
  this.reset();
  showApp();
});

document.getElementById('registerForm').addEventListener('submit', function(e){
  e.preventDefault();
  var f = this;
  if(f.password.value !== f.password2.value){ alert('كلمتا المرور غير متطابقتين'); return; }
  var users = get('users', []);
  for(var i=0;i<users.length;i++){ if(users[i].username === f.username.value.trim()){ alert('اسم المستخدم مسجل مسبقاً'); return; } }
  var newUser = { id: uid(), name:f.name.value.trim(), username:f.username.value.trim(), password:f.password.value, role:'member', active:true, created:Date.now() };
  users.push(newUser);
  set('users', users);
  var mems = get('members', []);
  mems.push({ id: uid(), userId: newUser.id, name: newUser.name, phone: f.phone.value.trim(), confessionFather: f.confessionFather.value.trim(), jobOrEdu: f.jobOrEdu.value.trim(), role:'member', created: Date.now() });
  set('members', mems);
  alert('✅ تم التسجيل بنجاح! يمكنك الآن تسجيل الدخول.');
  f.reset();
  showLogin();
});

var TABS = [

function showApp(){
  $('#authScreen').classList.add('hidden');
  $('#appScreen').classList.remove('hidden');
  $('#userChip').textContent = state.user.name + ' (' + (state.user.role === 'admin' ? '👑 مشرف عام' : state.user.role === 'leader' ? '💼 أمينة الخدمة' : '👤 مخدوم') + ')';
  renderTabs();
  render();
}
function renderTabs(){
  var html = '';
  TABS.forEach(function(t){
    html += '<button class="'+(state.tab === t.id ? 'active' : '')+'" onclick="go(\''+t.id+'\')">'+t.label+'</button>';
  });
  $('#tabs').innerHTML = html;
}
function go(t){ state.tab = t; renderTabs(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function memberPoints(id){
  var pts = get('points', []), total = 0;
  for(var i=0;i<pts.length;i++){ if(pts[i].memberId === id) total += (+pts[i].points||0); }
  return total;
}

function render(){
  var v = $('#view');
  if(state.tab === 'home') viewHome(v);
  else if(state.tab === 'calendar') viewCalendar(v);
  else if(state.tab === 'attendance') viewAttendance(v);
  else if(state.tab === 'members') viewMembers(v);
  else if(state.tab === 'points') viewPoints(v);
  else if(state.tab === 'notifications') viewNotifications(v);
  else if(state.tab === 'admin') viewAdmin(v);
}

  }

    '<div class="card">' +
      '<h3>📋 تسجيل الحضور التفاعلي</h3>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px">' +

        '<label>الاجتماع<input id="attSession" value="اجتماع الخميس - أسرة القديسة فيرينا"></label>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">' +
        '<button class="btn small green" onclick="setAllAttendance(\'present\')">✔️ الكل حاضر</button>' +

      '</div>' +

      this.classList.add('on');

function setAllAttendance(st){
  var rows = document.querySelectorAll('.att-row');
  rows.forEach(function(r){
    var inp = r.querySelector('input[value="'+st+'"]');
    if(inp) inp.parentElement.click();
  });
}
function saveAttendance(){
  var date = $('#attDate').value, session = $('#attSession').value;
  var mems = get('members', []), att = get('attendance', []), ptsLog = get('points', []);
  var s = get('settings', {pPresent:10, pLate:5, pExcused:1, pAbsent:0});
  mems.forEach(function(m){
    var checked = document.querySelector('input[name="att_'+m.id+'"]:checked');
    var st = checked ? checked.value : 'absent';
    var pts = st==='present'?s.pPresent:st==='late'?s.pLate:st==='excused'?s.pExcused:s.pAbsent;
    att.push({ id:uid(), memberId:m.id, date:date, session:session, status:st, points:pts, time:Date.now() });
    if(pts > 0){
      ptsLog.push({ id:uid(), memberId:m.id, points:pts, reason:'حضور '+session+' ('+date+')', date:Date.now() });
    }
  });
  set('attendance', att);
  set('points', ptsLog);
  alert('✅ تم حفظ سجل الحضور واحتساب النقاط بنجاح!');
  go('points');
}

  var target = null;
  for(var i=0;i<mems.length;i++){ if(mems[i].id === selId){ target = mems[i]; break; } }
  var pts = memberPoints(target.id);

  var opts = mems.map(function(m){ return '<option value="'+m.id+'" '+(m.id===selId?'selected':'')+'>'+esc(m.name)+'</option>'; }).join('');

  v.innerHTML =
    '<div class="card">' +

    '<div class="card" style="text-align:center">' +
      '<h3 style="justify-content:center;margin-bottom:4px">🌳 شجرة النمو الروحي: '+esc(target.name)+'</h3>' +
      '<div class="tree-box">' +
        '<div style="font-size:70px">🌳</div>' +
        '<div class="big-points">'+pts+'</div>' +
        '<div style="color:#6b6880;font-weight:700">إجمالي النقاط المكتسبة</div>' +
        '<div class="progress"><div style="width:'+Math.min(100, pts)+'%"></div></div>' +
      '</div>' +
      '<h4 style="margin:16px 0 8px;color:#5b21b6">🎁 منح نقاط تحفيزية ملونة فورية:</h4>' +
      '<div class="point-action">' +
        '<button class="green-btn" onclick="grantPts(\''+target.id+'\', 3, \'أخضر 🟢\')"><span style="font-size:24px">🟢</span><span>+3 نقاط</span></button>' +
        '<button class="blue-btn" onclick="grantPts(\''+target.id+'\', 5, \'أزرق 🔵\')"><span style="font-size:24px">🔵</span><span>+5 نقاط</span></button>' +
        '<button class="red-btn" onclick="grantPts(\''+target.id+'\', 10, \'أحمر 🔴\')"><span style="font-size:24px">🔴</span><span>+10 نقاط</span></button>' +
      '</div>' +
    '</div>';

  $('#pointMemberSelect').addEventListener('change', function(){
    state.pointMember = this.value;
    render();
  });
}
function grantPts(id, amt, colorName){
  var log = get('points', []);
  log.push({ id:uid(), memberId:id, points:amt, reason:'منح نقاط '+colorName+' بواسطة '+state.user.name, date:Date.now() });
  set('points', log);
  toast('✅ تم منح '+amt+' نقطة ('+colorName+')');
  render();
}

/* ================= 🔔 الإشعارات ================= */
function viewNotifications(v){
  var notifs = get('notifs', []);
  var listHTML = notifs.map(function(n){
    return '<div class="notif">' +
      '<h4>📢 '+esc(n.title)+'</h4>' +
      '<p>'+esc(n.body)+'</p>' +
      '<div style="font-size:12px;color:#8683a3;margin-top:6px">✍️ الكاتب: '+esc(n.author)+' • 🕒 '+fmtDate(n.date)+'</div>' +
    '</div>';
  }).join('');

  v.innerHTML =
    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">' +
        '<h3 style="margin:0">🔔 سجل الإشعارات والتعميمات ('+notifs.length+')</h3>' +
        '<button class="btn primary small" onclick="openSendNotifModal()">➕ كتابة إشعار جديد</button>' +
      '</div>' +
      (listHTML || '<p style="text-align:center;padding:24px;color:#8683a3">لا توجد إشعارات سابقة</p>') +
    '</div>';
}

function openSendNotifModal(){
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal-box">' +
    '<h3>📢 إرسال إشعار فوري جديد</h3>' +
    '<form id="sendNotifForm">' +
      '<label>عنوان الإشعار *<input name="title" required placeholder="مثال: تنبيه بخصوص موعد لقاء الخميس"></label>' +
      '<label>نص الإشعار *<textarea name="body" rows="4" required placeholder="اكتب تفاصيل التنبيه أو الكلمة هنا..."></textarea></label>' +
      '<label>الجمهور المستهدف<select name="audience"><option value="all">🌍 الجميع</option><option value="servants">🙋 الخدام فقط</option><option value="members">👥 المخدومين فقط</option></select></label>' +
      '<div style="display:flex;gap:10px;margin-top:16px"><button type="submit" class="btn primary" style="flex:1">📢 إرسال الآن للجميع</button><button type="button" class="btn ghost" onclick="closeModal()">إلغاء</button></div>' +
    '</form></div></div>';
  $('#modalRoot').innerHTML = html;
  $('#sendNotifForm').addEventListener('submit', function(e){
    e.preventDefault();
    var list = get('notifs', []);
    list.unshift({ id:uid(), title: this.title.value.trim(), body: this.body.value.trim(), audience: this.audience.value, author: state.user.name, date: Date.now() });
    set('notifs', list);
    toast('✅ تم إرسال الإشعار لجميع الأجهزة!');
    closeModal();
    render();
  });
}

/* ================= ⚙️ الإدارة ================= */
function viewAdmin(v){
  var users = get('users', []);
  var userRows = users.map(function(u){
    return '<tr>' +
      '<td><b>'+esc(u.name)+'</b></td>' +
      '<td>'+esc(u.username)+'</td>' +
      '<td>'+(u.role==='admin'?'👑 مشرف عام':u.role==='leader'?'💼 أمينة الخدمة':'👤 مخدوم')+'</td>' +
      '<td>'+(u.active!==false?'<span style="color:#059669;font-weight:700">✅ مفعل</span>':'<span style="color:#dc2626;font-weight:700">⛔ موقوف</span>')+'</td>' +
      '<td><button class="btn small ghost" onclick="toggleUserActive(\''+u.id+'\')">'+(u.active!==false?'إيقاف':'تفعيل')+'</button></td>' +
    '</tr>';
  }).join('');

  v.innerHTML =
    '<div class="card">' +
      '<h3>👥 إدارة المستخدمين والحسابات</h3>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الرتبة</th><th>الحالة</th><th>إجراء</th></tr></thead>' +
        '<tbody>'+userRows+'</tbody>' +
      '</table></div>' +
    '</div>' +
    '<div class="card">' +
      '<h3>🗄️ إدارة وتصدير البيانات</h3>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn green" onclick="exportDataJSON()">⬇️ تصدير نسخة احتياطية (JSON)</button>' +
        '<button class="btn amber" onclick="downloadSelfHTML()">📥 تنزيل كود المنصة بالكامل (index.html)</button>' +
        '<button class="btn red" onclick="wipeAllData()">🗑️ تصفير كافة البيانات والبدء من جديد</button>' +
      '</div>' +
    '</div>';
}
function toggleUserActive(id){
  var list = get('users', []);
  for(var i=0;i<list.length;i++){ if(list[i].id === id){ list[i].active = !list[i].active; break; } }
  set('users', list);
  toast('✅ تم تعديل حالة الحساب');
  render();
}
function exportDataJSON(){
  var dump = {};
  KEYS.forEach(function(k){ dump[k] = get(k, []); });
  var blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'church_backup_'+todayStr()+'.json';
  a.click();
}
function wipeAllData(){
  if(!confirm('⚠️ تحذير: هل أنت متأكد من مسح كافة السجلات والبدء من نقطة الصفر؟')) return;
  set('members', []);
  set('attendance', []);
  set('points', []);
  set('notifs', []);
  toast('🧹 تم تصفير البيانات بنجاح');
  render();
}

function closeModal(){ $('#modalRoot').innerHTML = ''; }

/* تنزيل الملف المصدري بالكامل */
function downloadSelfHTML(){
  var htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('📥 تم بدء تحميل ملف index.html');
}

init();
</script>
</body>
</html>
